<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CIR Dashboard Promo</title>
<!--
  CIR Bookings dashboard promo, 1080×1920 (9:16) at 30 fps, 50.5 s. Storyboard: ../VIDEO-SCENES-DASHBOARD.md
  Motion follows references/linkedin-video-801kbps.mp4; colours, type and components come from the
  Figma file "bs internal tools" (CIR · Design System). Screens are Figma exports of the Bookings page.
  Deterministic: window.render(t) draws the frame at time t (seconds).
  Camera regions and highlight rects are in Figma frame units (frames are 1440 wide; the PDF is 922).
-->
<style>
  :root {
    --neutral-100: #f4f5f7;
    --neutral-200: #e8eaf0;
    --neutral-300: #dcdfe6;
    --text-primary: #202938;
    --text-secondary: #7c8492;
    --orchid-500: #b23ad4;
    --orchid-600: #8c03b3;
    --orchid-700: #8200a6;
    --pink-200: #fdb5df;
    --berry-500: #b92e72;
    --teal-50: #effbfc;
    --teal-500: #41b7c4;
    --scrim: #202938;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--neutral-100); }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--neutral-100); }
  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; inset: 0; }
  img { display: block; }

  #brand { left: 60px; top: 80px; display: flex; align-items: center; gap: 14px; }
  #brand .mascot { width: 52px; height: 52px; }

  /* Animated mascot: expression frames from the Figma "References" sheet, swapped per frame */
  .mascot { position: relative; }
  .mascot .body { position: absolute; inset: 0; }
  .mascot .body img { position: absolute; display: none; filter: url(#clean); max-width: none; }
  #brand b { font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  #brand span { font-size: 26px; color: var(--text-secondary); margin-left: 4px; }

  .gh { height: 0; border-top: 2px dashed #a4abb6; width: 1080px; transform-origin: 0 0; opacity: .6; }
  .gv { width: 0; border-left: 2px dashed #a4abb6; transform-origin: 0 0; opacity: .6; }

  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
  .wi { display: inline-block; will-change: transform; }

  .head { left: 60px; top: 176px; width: 960px; }
  .head h1 { font-weight: 500; font-size: 80px; line-height: 1.06; letter-spacing: -0.035em; }
  .head p { font-size: 34px; line-height: 1.3; color: var(--text-secondary); margin-top: 18px; }

  .tile { overflow: hidden; }
  .tile > img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .grain::after { content: ""; position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  #win { left: 60px; top: 440px; width: 960px; height: 1396px; background: #fff; border: 2px solid var(--neutral-200); border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px rgba(32, 41, 56, .14); }
  #win .bar { height: 64px; background: var(--neutral-100); border-bottom: 2px solid var(--neutral-200); position: relative; }
  #win .bar i { position: absolute; top: 25px; width: 14px; height: 14px; border-radius: 50%; background: var(--neutral-300); }
  #win .url { position: absolute; left: 50%; top: 13px; transform: translateX(-50%); width: 360px; height: 38px; border-radius: 999px; background: #fff; border: 2px solid var(--neutral-200); font-size: 20px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; }
  #vp { position: relative; width: 956px; height: 1330px; overflow: hidden; background: #fff; }
  #vp .shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }

  /* Orchid focus ring, as on a focused input in the app */
  .ring { border: 3px solid var(--orchid-500); border-radius: 14px; box-shadow: 0 0 0 8px rgba(178, 58, 212, .16); }
  .ring::after { content: ""; position: absolute; inset: 0; border-radius: 11px; background: rgba(178, 58, 212, var(--press, 0)); }

  .btn { background: linear-gradient(180deg, var(--orchid-500), var(--orchid-700)); border: 2px solid var(--orchid-600); color: #fff; font-weight: 500; font-size: 34px; padding: 24px 56px 24px 44px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>

<div id="stage">

<script>
// Pacing: the timeline below is written in "story" seconds; WARP stretches it into real seconds.
// KPIs run 2.2× slower, the other feature scenes 1.45× slower; open, close and end card keep their timing.
const KPI_END_REAL = 4.3 + (9.6 - 4.3) * 2.2;
const BODY_END_REAL = KPI_END_REAL + (45.5 - 9.6) * 1.45;
const WARP = [[0, 0], [4.3, 4.3], [KPI_END_REAL, 9.6], [BODY_END_REAL, 45.5], [BODY_END_REAL + 5, 50.5]];
const DURATION = BODY_END_REAL + 5;
const VW = 956, VH = 1330;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 4);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.3, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const tf = (el, { x = 0, y = 0, s = 1, o = 1 } = {}) => { el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; el.style.opacity = o; };
const story = r => { for (let i = 0; i < WARP.length - 1; i++) { const [r0, s0] = WARP[i], [r1, s1] = WARP[i + 1]; if (r <= r1) return s0 + (r - r0) * (s1 - s0) / (r1 - r0); } return 50.5 + r - WARP[WARP.length - 1][0]; };
const show = (el, on) => { el.style.display = on ? '' : 'none'; return on; };

// ── Scene headlines ───────────────────────────────────────────
const SCENES = [
  [4.3, 9.6, 'The numbers that matter.', ''],
  [9.6, 19.2, 'Month, week, day.', 'Zoom from the whole month down to a single day.'],
  [19.2, 24.6, 'Every booking in a table.', 'Filter by date, status, crew or package.'],
  [24.6, 30.6, 'See who’s on each booking.', 'Filter by crew, or open a booking to see its team.'],
  [30.6, 37.4, 'Every crew member’s bookings.', 'Tap a name to see their schedule.'],
  [37.4, 45.5, 'Never miss a due balance.', 'The rail flags what’s due today and this week.'],
];
// KPI captions: name the KPI, then explain its number (story seconds)
const KPI_CAPS = [
  [4.95, 6.6, 'Bookings this month: 24.', 'Every booking scheduled for November. That’s 4 more than last month.'],
  [6.65, 8.1, 'Outstanding balance: Rp 48.750.000.', 'Money clients still owe you, spread across 14 bookings.'],
  [8.15, 9.55, 'Collected this month: Rp 61.200.000.', 'Payments received in November, up 12,4% on last month.'],
];
KPI_CAPS.forEach(([, , title, body], i) => $('kpiCaps').insertAdjacentHTML('beforeend',
  `<div class="abs kcap" id="k${i}" style="left:60px; top:286px; width:960px; font-size:34px; line-height:1.32; color:var(--text-secondary)"><b style="font-weight:600; color:var(--text-primary)">${title}</b> ${body}</div>`));
SCENES.forEach(([, , h, s], i) => $('heads').insertAdjacentHTML('beforeend',
  `<div class="abs head" id="h${i}"><h1 class="reveal">${h}</h1><p>${s}</p></div>`));

// ── Camera shots: [time, x, y, w] keys in Figma units ─────────
const IMG = { 'd-kpi': 1440, 'dash-calendar': 1440, 'b-week': 1440, 'd-day': 1440, 'dash-table': 1440, 'd-crew-filter': 1440, 'd-crew-detail': 1440, 'd-crew-popover': 1440, 'd-day-crew': 1440, 'b-rail': 1440, 'd-rail-detail': 1440 };
const SHOTS = [
  /* 0 KPIs */      { img: 'd-kpi', from: 3.7, keys: [[4.4, 440, 0, 1000], [4.95, 440, 0, 1000], [5.3, 0, 0, 420], [6.45, 0, 0, 420], [6.8, 322, 0, 420], [7.95, 322, 0, 420], [8.3, 660, 0, 420]] },
  /* 1 month */     { img: 'dash-calendar', from: 9.5, keys: [[9.6, 660, 0, 420], [10.4, 300, 440, 760], [11.5, 300, 440, 760], [12.6, 14, 440, 760]] },
  /* 2 week */      { img: 'b-week', from: 12.75, keys: [[12.75, 300, 440, 760], [13.8, 300, 440, 760], [15.2, 14, 470, 760]] },
  /* 3 day */       { img: 'd-day', from: 15.5, keys: [[15.5, 300, 440, 760], [16.5, 300, 440, 760], [17.2, 14, 470, 760], [17.9, 14, 470, 760], [18.7, 280, 470, 760]] },
  /* 4 table */     { img: 'dash-table', from: 19.1, keys: [[19.2, 20, 346, 640], [21.3, 20, 346, 640], [22.7, 400, 346, 640]] },
  /* 5 crew filt */ { img: 'd-crew-filter', from: 24.5, keys: [[24.6, 560, 330, 640]] },
  /* 6 detail */    { img: 'd-crew-detail', from: 27.3, keys: [[27.3, 820, 0, 620]] },
  /* 7 popover */   { img: 'd-crew-popover', from: 31.25, keys: [[31.25, 820, 0, 620], [31.9, 820, 0, 620], [32.8, 820, 360, 620]] },
  /* 8 day+crew */  { img: 'd-day-crew', from: 35.45, slide: true, keys: [[35.45, 260, 400, 620]] },
  /* 9 rail */      { img: 'b-rail', from: 37.3, keys: [[37.4, 1020, 80, 413], [39.0, 1020, 80, 413], [39.8, 1020, 546, 413]] },
  /* 10 due */      { img: 'd-rail-detail', from: 41.7, keys: [[41.75, 820, 50, 620]] },
];
const FADE = .45;
SHOTS.forEach((s, i) => {
  s.to = i < SHOTS.length - 1 ? SHOTS[i + 1].from + FADE + .05 : 99;
  s.el = document.createElement('img');
  s.el.className = 'shot';
  s.el.src = `assets/figma/${s.img}.png`;
  s.el.style.width = IMG[s.img] + 'px';
  $('vp').appendChild(s.el);
});
function cam(shot, t) {
  const k = shot.keys;
  if (t <= k[0][0]) return k[0].slice(1);
  for (let i = 0; i < k.length - 1; i++) {
    if (t <= k[i + 1][0]) {
      const x = eInOut(p(t, k[i][0], k[i + 1][0] - k[i][0]));
      return [1, 2, 3].map(j => lerp(k[i][j], k[i + 1][j], x));
    }
  }
  return k[k.length - 1].slice(1);
}
const toScreen = (shot, t, [x, y, w, h]) => { const [cx, cy, cw] = cam(shot, t); const s = VW / cw; return [(x - cx) * s, (y - cy) * s, w * s, h * s]; };

// ── Focus rings and row reveals (Figma units, tied to a shot) ─
const RINGS = [
  { shot: 0, t0: 5.35, t1: 6.55, r: [33, 167, 322, 155] },
  { shot: 0, t0: 6.85, t1: 8.05, r: [371, 167, 322, 155] },
  { shot: 0, t0: 8.35, t1: 9.55, r: [709, 167, 322, 155] },
  { shot: 1, t0: 10.6, t1: 11.5, r: [942, 496, 62, 40] },
  { shot: 2, t0: 12.8, t1: 13.7, r: [864, 496, 58, 40], press: 13.15 },
  { shot: 3, t0: 15.55, t1: 16.45, r: [786, 496, 56, 40], press: 15.9 },
  { shot: 3, t0: 17.25, t1: 17.95, r: [30, 598, 290, 70] },
  { shot: 3, t0: 18.6, t1: 19.3, r: [640, 598, 340, 70] },
  { shot: 4, t0: 19.7, t1: 20.9, r: [26, 452, 600, 44] },
  { shot: 4, t0: 23.0, t1: 24.3, r: [410, 560, 620, 60] },
  { shot: 5, t0: 24.8, t1: 25.5, r: [786, 410, 108, 32], press: 25.1 },
  { shot: 5, t0: 25.6, t1: 26.5, r: [794, 504, 304, 44] },
  { shot: 5, t0: 26.1, t1: 27.0, r: [794, 552, 304, 44] },
  { shot: 6, t0: 27.9, t1: 29.4, r: [896, 518, 510, 46] },
  { shot: 6, t0: 30.6, t1: 31.3, r: [1054, 524, 120, 34], press: 30.95 },
  { shot: 7, t0: 33.2, t1: 34.3, r: [1062, 752, 328, 74] },
  { shot: 7, t0: 34.5, t1: 35.4, r: [1072, 1082, 124, 28], press: 34.95 },
  { shot: 8, t0: 36.0, t1: 37.1, r: [506, 922, 328, 74] },
  { shot: 9, t0: 37.8, t1: 38.8, r: [1080, 156, 300, 104] },
  { shot: 9, t0: 40.0, t1: 41.0, r: [1080, 684, 300, 146] },
  { shot: 9, t0: 41.0, t1: 41.7, r: [1100, 778, 100, 34], press: 41.3 },
  { shot: 10, t0: 42.3, t1: 43.5, r: [896, 186, 514, 124] },
  { shot: 10, t0: 43.7, t1: 45.0, r: [896, 774, 514, 130] },
];
RINGS.forEach(r => { r.el = document.createElement('div'); r.el.className = 'abs ring'; $('vp').appendChild(r.el); });

// Collage crops: data-crop="img,frameWidth,x,y,regionWidth"
$$('[data-crop]').forEach(el => {
  const [img, fw, x, y, w] = el.dataset.crop.split(',');
  const s = el.offsetWidth / +w;
  el.insertAdjacentHTML('beforeend', `<img src="assets/figma/${img}.png" style="width:${fw}px; transform: translate(${-x * s}px, ${-y * s}px) scale(${s})">`);
});

// Word reveal
$$('.reveal').forEach(el => {
  el.innerHTML = el.innerHTML.split(/<br\s*\/?>/i).map(line =>
    line.trim().split(/\s+/).map(w => `<span class="w"><span class="wi">${w}</span></span>`).join(' ')).join('<br>');
});
function words(el, t, start, end, stagger = .06) {
  const out = eIn(p(t, end - .35, .3));
  $$('.wi', el).forEach((w, i) => {
    const x = eOut(p(t, start + i * stagger, .55));
    w.style.transform = `translateY(${(1 - x) * 110 - out * 110}%)`;
  });
}

// ── Mascot ────────────────────────────────────────────────────
// Frames are cut from the Figma References sheet (270×275 crops, ball Ø≈200 centred at 135,125).
const MFRAMES = ['idle', 'blink', 'happy', 'excited', 'surprised', 'alert', 'curious', 'look-left', 'look-right', 'look-up', 'look-down', 'look-up-right', 'look-down-left', 'shy', 'small', 'normal'];
$$('.mascot').forEach(el => {
  const ball = +el.dataset.ball, k = ball / 200, W = el.offsetWidth, H = el.offsetHeight;
  const body = document.createElement('div');
  body.className = 'body';
  body.style.transformOrigin = `50% ${H / 2 + ball / 2}px`;
  el.appendChild(body);
  el._f = {};
  MFRAMES.forEach(n => {
    const i = document.createElement('img');
    i.src = `assets/figma/mascot/${n}.png`;
    Object.assign(i.style, { width: `${270 * k}px`, left: `${W / 2 - 135 * k}px`, top: `${H / 2 - 125 * k}px`, clipPath: `inset(${12 * k}px ${14 * k}px 0 ${14 * k}px)` });
    body.appendChild(i);
    el._f[n] = i;
  });
  el._body = body;
  el._ball = ball;
});

// One beat of a mascot script: [start, frame, duration?, hop?]. Between beats it idles.
function mascot(el, t, { base = 'idle', beats = [], blinkEvery = 3.2, blinkOffset = 0, phase = 0 } = {}) {
  let frame = base, hopY = 0, sx = 1, sy = 1;
  for (const [t0, f, dur = .6, hop = 0] of beats) {
    if (t >= t0 && t < t0 + dur) {
      frame = f;
      if (hop) {
        const k = p(t, t0, .55);
        hopY = -Math.sin(Math.PI * k) * hop * el._ball;
        const land = p(t, t0 + .5, .25), squash = Math.sin(Math.PI * land) * .07, take = Math.sin(Math.PI * p(t, t0, .12)) * .05;
        sx += squash + take; sy -= squash + take;
        sy += Math.sin(Math.PI * k) * .04; sx -= Math.sin(Math.PI * k) * .03;
      }
    }
  }
  const idleLike = !['blink', 'happy', 'excited', 'shy'].includes(frame);
  if (idleLike && ((t + blinkOffset) % blinkEvery) < .13) frame = 'blink';
  const br = Math.sin(2 * Math.PI * (t + phase) / 1.8);
  sy *= 1 + .022 * br; sx *= 1 - .016 * br;
  for (const n in el._f) el._f[n].style.display = n === frame ? 'block' : 'none';
  el._body.style.transform = `translateY(${hopY}px) scale(${sx}, ${sy})`;
}

const BRAND_BEATS = [
  [5.3, 'look-down-left', 1.2], [6.8, 'look-down', 1.0], [8.3, 'happy', 1.0, .2],
  [10.6, 'curious', .8], [13.15, 'excited', .5, .22], [15.9, 'excited', .5, .22], [17.5, 'happy', 1.0],
  [19.7, 'look-down', 1.2], [22.0, 'look-right', 1.0], [25.1, 'excited', .5, .22], [26.1, 'happy', .8],
  [27.9, 'look-right', 1.4], [30.95, 'excited', .5, .25], [31.6, 'surprised', .7], [33.2, 'happy', 1.0, .2],
  [34.95, 'excited', .5, .22], [36.0, 'happy', 1.0], [37.8, 'look-right', 1.0], [40.0, 'alert', 1.0, .2],
  [41.3, 'excited', .5, .22], [42.3, 'curious', 1.0], [43.7, 'happy', 1.2, .25],
];

function renderStory(t) {
  mascot($('mBrand'), t, { base: 'look-down', beats: BRAND_BEATS, blinkEvery: 3.4, blinkOffset: 1.1 });
  if (t < 4.3) mascot($('mOpen'), t, { beats: [[0, 'surprised', 1.1, .35], [2.2, 'look-up', .5], [2.7, 'happy', 1.6, .3]], blinkOffset: 1.4, phase: .3 });
  if (t >= 45.5 && t < 48.6) mascot($('logo'), t, { beats: [[45.6, 'surprised', .6], [46.2, 'look-left', .4], [46.6, 'look-right', .4], [47.0, 'look-down', .5], [47.55, 'excited', .55, .3], [48.1, 'happy', 1]], blinkOffset: 1.85 });
  if (t >= 48.5) mascot($('mEnd'), t, { beats: [[48.5, 'happy', .9], [49.4, 'idle', .5], [50.05, 'happy', 1, .2]], blinkOffset: 1.3 });

  // Brand row
  $('brand').style.opacity = clamp(Math.min(p(t, 4.2, .4), 1 - p(t, 45.3, .3)));

  // Open
  if (show($('open'), t < 4.3)) {
    $$('[data-t]', $('open')).forEach(el => {
      const [i, dir] = el.dataset.t.split(',');
      const x = eOut(p(t, .1 + i * .09, .8));
      const w = el.offsetWidth, h = el.offsetHeight;
      const off = { l: [-w, 0], r: [w, 0], t: [0, -h], b: [0, h] }[dir];
      el.style.transform = `translate(${off[0] * (1 - x)}px, ${off[1] * (1 - x)}px)`;
    });
    $$('[data-g]', $('open')).forEach(g => {
      const x = eOut(p(t, .6 + .08 * g.dataset.g, .6));
      g.style.transform = g.classList.contains('gh') ? `scaleX(${x})` : `scaleY(${x})`;
    });
    const c = eOut(p(t, .7, .5));
    tf($('openCap'), { y: (1 - c) * 20, o: c });
    words($('openH'), t, .8, 99, .12);
    const q = eInOut(p(t, 3.6, .6));
    tf($('open'), { y: -260 * q, o: 1 - q });
  }

  // Headlines
  SCENES.forEach(([a, b], i) => {
    const el = $(`h${i}`);
    if (!show(el, t >= a && t < b)) return;
    words($('h' + i).querySelector('h1'), t, a + .1, b);
    const sub = el.querySelector('p');
    sub.style.opacity = eOut(p(t, a + .45, .4)) * (1 - p(t, b - .35, .25));
    sub.style.transform = `translateY(${(1 - eOut(p(t, a + .45, .4))) * 16}px)`;
  });

  KPI_CAPS.forEach(([a, b], i) => {
    const el = $(`k${i}`);
    if (!show(el, t >= a && t < b)) return;
    const x = eOut(p(t, a, .3)), out = p(t, b - .2, .2);
    tf(el, { y: (1 - x) * 18 - out * 10, o: x * (1 - out) });
  });

  // Window
  const winIn = eOut(p(t, 3.7, .9)), winOut = eIn(p(t, 45.2, .6));
  if (show($('win'), t >= 3.7 && t < 45.9)) tf($('win'), { y: 1400 * (1 - winIn) + 1500 * winOut });

  SHOTS.forEach((s, i) => {
    const on = t >= s.from && t < s.to;
    s.el.style.display = on ? '' : 'none';
    if (!on) return;
    const [cx, cy, cw] = cam(s, t);
    const sc = VW / cw;
    const f = i === 0 ? 1 : eOut(p(t, s.from, FADE));
    const dy = s.slide ? (1 - f) * 260 : 0;
    s.el.style.transform = `translate(${-cx * sc}px, ${-cy * sc + dy}px) scale(${sc})`;
    s.el.style.opacity = f;
  });

  RINGS.forEach(r => {
    const on = t >= r.t0 && t < r.t1;
    r.el.style.display = on ? '' : 'none';
    if (!on) return;
    const [x, y, w, h] = toScreen(SHOTS[r.shot], t, r.r);
    const pad = 8;
    Object.assign(r.el.style, { left: `${x - pad}px`, top: `${y - pad}px`, width: `${w + pad * 2}px`, height: `${h + pad * 2}px` });
    const o = Math.min(eOut(p(t, r.t0, .25)), 1 - p(t, r.t1 - .25, .25));
    let s = lerp(1.06, 1, eOut(p(t, r.t0, .3))), press = 0;
    [].concat(r.press ?? []).forEach(pt => { const k = p(t, pt, .35); const b = Math.sin(Math.PI * k); s -= .04 * b; press = Math.max(press, .14 * b); });
    r.el.style.opacity = o;
    r.el.style.transform = `scale(${s})`;
    r.el.style.setProperty('--press', press);
  });

  // Close
  if (show($('close'), t >= 45.5 && t < 48.6)) {
    $('close').style.opacity = 1 - p(t, 48.3, .3);
    const l = eBack(p(t, 45.7, .6));
    $('logo').style.transformOrigin = 'center';
    tf($('logo'), { s: lerp(.5, 1, l), o: clamp(l * 1.6) });
    const g = eOut(p(t, 45.6, .9));
    $('glow').style.transformOrigin = 'center';
    tf($('glow'), { s: lerp(.6, 1, g), o: g });
    words($('closeH'), t, 46.0, 99, .1);
    const sb = eOut(p(t, 46.4, .5));
    tf($('closeSub'), { y: (1 - sb) * 20, o: sb });
    const bt = eBack(p(t, 46.8, .5));
    tf($('closeBtn'), { s: lerp(.8, 1, bt) - .05 * Math.sin(Math.PI * p(t, 47.45, .3)), o: clamp(bt * 1.6) });
  }

  // End card
  if (show($('end'), t >= 48.5)) {
    const m = eBack(p(t, 48.6, .55));
    $('mEnd').style.transformOrigin = 'center';
    tf($('mEnd'), { s: lerp(.4, 1, m), o: clamp(m * 1.6) });
    const e = eOut(p(t, 48.8, .5));
    tf($('endT'), { y: (1 - e) * 16, o: e });
  }
}
window.render = tr => renderStory(story(tr));

window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map(i => i.decode().catch(() => {})),
]).then(() => { window.render(0); return true; });

if (location.hash.startsWith('#t=')) window.ready.then(() => window.render(parseFloat(location.hash.slice(3))));
if (location.hash === '#play') window.ready.then(() => { const t0 = performance.now(); const loop = n => { window.render(((n - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
</script>
</body>
</html>
