  Figma file "bs internal tools" (CIR · Design System). Screens are Figma exports of the Bookings page.

<style>

const D = d => (d <= 4.3 ? d : 4.3 + (d - 4.3) * 41.2 / 71.0);
const BODY_END_REAL = 4.3 + 71.0 * 1.35;
const WARP = [[0, 0], [4.3, 4.3], [BODY_END_REAL, 45.5], [BODY_END_REAL + 5, 50.5]];

const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 4);

SHOTS.forEach(s => { s.from = D(s.from); s.keys.forEach(k => { k[0] = D(k[0]); }); });
const FADE = .45;
SHOTS.forEach((s, i) => {

  s.el = document.createElement('img');

function cam(shot, t) {
  const k = shot.keys;
  if (t <= k[0][0]) return k[0].slice(1);
  for (let i = 0; i < k.length - 1; i++) {
    if (t <= k[i + 1][0]) {
      const x = eInOut(p(t, k[i][0], k[i + 1][0] - k[i][0]));
      return [1, 2, 3].map(j => lerp(k[i][j], k[i + 1][j], x));
    }
  }
  return k[k.length - 1].slice(1);
}
const toScreen = (shot, t, [x, y, w, h]) => { const [cx, cy, cw] = cam(shot, t); const s = VW / cw; return [(x - cx) * s, (y - cy) * s, w * s, h * s]; };

// Collage crops: data-crop="img,frameWidth,x,y,regionWidth"

function words(el, t, start, end, stagger = .06) {
  const out = eIn(p(t, end - .35, .3));

}

// ── Mascot ────────────────────────────────────────────────────
// Frames are cut from the Figma References sheet (270×275 crops, ball Ø≈200 centred at 135,125).
const MFRAMES = ['idle', 'blink', 'happy', 'excited', 'surprised', 'alert', 'curious', 'look-left', 'look-right', 'look-up', 'look-down', 'look-up-right', 'look-down-left', 'shy', 'small', 'normal'];
$$('.mascot').forEach(el => {
  const ball = +el.dataset.ball, k = ball / 200, W = el.offsetWidth, H = el.offsetHeight;
  const body = document.createElement('div');
  body.className = 'body';
  body.style.transformOrigin = `50% ${H / 2 + ball / 2}px`;
  el.appendChild(body);
  el._f = {};
  MFRAMES.forEach(n => {
    const i = document.createElement('img');
    i.src = `assets/figma/mascot/${n}.png`;
    Object.assign(i.style, { width: `${270 * k}px`, left: `${W / 2 - 135 * k}px`, top: `${H / 2 - 125 * k}px`, clipPath: `inset(${12 * k}px ${14 * k}px 0 ${14 * k}px)` });
    body.appendChild(i);
    el._f[n] = i;
  });
  el._body = body;
  el._ball = ball;
});

// One beat of a mascot script: [start, frame, duration?, hop?]. Between beats it idles.
function mascot(el, t, { base = 'idle', beats = [], blinkEvery = 3.2, blinkOffset = 0, phase = 0 } = {}) {
  let frame = base, hopY = 0, sx = 1, sy = 1;
  for (const [t0, f, dur = .6, hop = 0] of beats) {
    if (t >= t0 && t < t0 + dur) {
      frame = f;
      if (hop) {
        const k = p(t, t0, .55);
        hopY = -Math.sin(Math.PI * k) * hop * el._ball;
        const land = p(t, t0 + .5, .25), squash = Math.sin(Math.PI * land) * .07, take = Math.sin(Math.PI * p(t, t0, .12)) * .05;
        sx += squash + take; sy -= squash + take;
        sy += Math.sin(Math.PI * k) * .04; sx -= Math.sin(Math.PI * k) * .03;
      }
    }
  }
  const idleLike = !['blink', 'happy', 'excited', 'shy'].includes(frame);
  if (idleLike && ((t + blinkOffset) % blinkEvery) < .13) frame = 'blink';
  const br = Math.sin(2 * Math.PI * (t + phase) / 1.8);
  sy *= 1 + .022 * br; sx *= 1 - .016 * br;
  for (const n in el._f) el._f[n].style.display = n === frame ? 'block' : 'none';
  el._body.style.transform = `translateY(${hopY}px) scale(${sx}, ${sy})`;
}

const BRAND_BEATS = [
  [5.0, 'curious', .9], [6.35, 'excited', .5, .22], [8.8, 'excited', .5, .22], [10.0, 'look-down', 1.0], [11.5, 'excited', .5, .22],
  [12.6, 'surprised', .8], [14.4, 'excited', .5, .22], [15.4, 'look-down', 1.0], [16.9, 'excited', .5, .22], [18.2, 'curious', .7], [18.9, 'excited', .5, .22],
  [20.7, 'look-down', 1.5], [23.6, 'excited', .4], [24.2, 'happy', .8], [26.3, 'look-down', 1.2], [30.3, 'excited', .5, .22],
  [32.4, 'happy', 1.2], [36.6, 'surprised', .8], [39.4, 'excited', .5, .22], [41.8, 'curious', 1.0], [44.2, 'excited', .5, .22],
  [47.05, 'excited', .5, .22], [47.6, 'happy', 1.0, .3], [50.6, 'excited', .5, .22], [53.6, 'happy', 1.2],
  [56.4, 'excited', .5, .22], [57.3, 'curious', 1.0], [59.8, 'happy', .8], [61.5, 'excited', .5, .22], [62, 'happy', 1.0, .3],
  [65, 'excited', .5, .22], [67.6, 'look-down', 1.0], [69.1, 'happy', 1.2, .25], [71.3, 'look-right', 1.2], [73.8, 'excited', .6, .3],
].map(([t, ...rest]) => [D(t), ...rest]);

function renderStory(t) {
  mascot($('mBrand'), t, { base: 'look-down', beats: BRAND_BEATS, blinkEvery: 3.4, blinkOffset: 1.1 });
  if (t < 4.3) mascot($('mOpen'), t, { beats: [[0, 'surprised', 1.1, .35], [2.2, 'look-up', .5], [2.7, 'happy', 1.6, .3]], blinkOffset: 1.4, phase: .3 });
  if (t >= 45.5 && t < 48.6) mascot($('logo'), t, { beats: [[45.6, 'surprised', .6], [46.2, 'look-left', .4], [46.6, 'look-right', .4], [47.0, 'look-down', .5], [47.55, 'excited', .55, .3], [48.1, 'happy', 1]], blinkOffset: 1.85 });
  if (t >= 48.5) mascot($('mEnd'), t, { beats: [[48.5, 'happy', .9], [49.4, 'idle', .5], [50.05, 'happy', 1, .2]], blinkOffset: 1.3 });

  // Brand row
  $('brand').style.opacity = clamp(Math.min(p(t, 4.2, .4), 1 - p(t, 45.3, .3)));

  // Open
  if (show($('open'), t < 4.3)) {
    $$('[data-t]', $('open')).forEach(el => {
      const [i, dir] = el.dataset.t.split(',');
      const x = eOut(p(t, .1 + i * .09, .8));
      const w = el.offsetWidth, h = el.offsetHeight;
      const off = { l: [-w, 0], r: [w, 0], t: [0, -h], b: [0, h] }[dir];
      el.style.transform = `translate(${off[0] * (1 - x)}px, ${off[1] * (1 - x)}px)`;
    });
    $$('[data-g]', $('open')).forEach(g => {
      const x = eOut(p(t, .6 + .08 * g.dataset.g, .6));
      g.style.transform = g.classList.contains('gh') ? `scaleX(${x})` : `scaleY(${x})`;
    });
    const c = eOut(p(t, .7, .5));
    tf($('openCap'), { y: (1 - c) * 20, o: c });
    words($('openH'), t, .8, 99, .12);
    const q = eInOut(p(t, 3.6, .6));
    tf($('open'), { y: -260 * q, o: 1 - q });
  }

  // Headlines
  SCENES.forEach(([a, b], i) => {
    const el = $(`h${i}`);
    if (!show(el, t >= a && t < b)) return;
    words($('h' + i).querySelector('h1'), t, a + .1, b);
    const sub = el.querySelector('p');
    sub.style.opacity = eOut(p(t, a + .45, .4)) * (1 - p(t, b - .35, .25));
    sub.style.transform = `translateY(${(1 - eOut(p(t, a + .45, .4))) * 16}px)`;
  });

  KPI_CAPS.forEach(([a, b], i) => {
    const el = $(`k${i}`);
    if (!show(el, t >= a && t < b)) return;
    const x = eOut(p(t, a, .3)), out = p(t, b - .2, .2);
    tf(el, { y: (1 - x) * 18 - out * 10, o: x * (1 - out) });
  });

  // Window
  const winIn = eOut(p(t, 3.7, .9)), winOut = eIn(p(t, 45.2, .6));
  if (show($('win'), t >= 3.7 && t < 45.9)) tf($('win'), { y: 1400 * (1 - winIn) + 1500 * winOut });

  SHOTS.forEach((s, i) => {
    const on = t >= s.from && t < s.to;
    s.el.style.display = on ? '' : 'none';
    if (!on) return;
    const [cx, cy, cw] = cam(s, t);
    const sc = VW / cw;
    const f = i === 0 ? 1 : eOut(p(t, s.from, FADE));
    const dy = s.slide ? (1 - f) * 260 : 0;
    s.el.style.transform = `translate(${-cx * sc}px, ${-cy * sc + dy}px) scale(${sc})`;
    s.el.style.opacity = f;
  });

  RINGS.forEach(r => {
    const on = t >= r.t0 && t < r.t1;
    r.el.style.display = on ? '' : 'none';
    if (!on) return;
    const [x, y, w, h] = toScreen(SHOTS[r.shot], t, r.r);
    const pad = 8;
    Object.assign(r.el.style, { left: `${x - pad}px`, top: `${y - pad}px`, width: `${w + pad * 2}px`, height: `${h + pad * 2}px` });
    const o = Math.min(eOut(p(t, r.t0, .25)), 1 - p(t, r.t1 - .25, .25));
    let s = lerp(1.06, 1, eOut(p(t, r.t0, .3))), press = 0;
    [].concat(r.press ?? []).forEach(pt => { const k = p(t, pt, .35); const b = Math.sin(Math.PI * k); s -= .04 * b; press = Math.max(press, .14 * b); });
    r.el.style.opacity = o;
    r.el.style.transform = `scale(${s})`;
    r.el.style.setProperty('--press', press);
  });

  // Close
  if (show($('close'), t >= 45.5 && t < 48.6)) {
    $('close').style.opacity = 1 - p(t, 48.3, .3);
    const l = eBack(p(t, 45.7, .6));
    $('logo').style.transformOrigin = 'center';
    tf($('logo'), { s: lerp(.5, 1, l), o: clamp(l * 1.6) });
    const g = eOut(p(t, 45.6, .9));
    $('glow').style.transformOrigin = 'center';
    tf($('glow'), { s: lerp(.6, 1, g), o: g });
    words($('closeH'), t, 46.0, 99, .1);
    const sb = eOut(p(t, 46.4, .5));
    tf($('closeSub'), { y: (1 - sb) * 20, o: sb });
    const bt = eBack(p(t, 46.8, .5));
    tf($('closeBtn'), { s: lerp(.8, 1, bt) - .05 * Math.sin(Math.PI * p(t, 47.45, .3)), o: clamp(bt * 1.6) });
  }

  // End card
  if (show($('end'), t >= 48.5)) {
    const m = eBack(p(t, 48.6, .55));
    $('mEnd').style.transformOrigin = 'center';
    tf($('mEnd'), { s: lerp(.4, 1, m), o: clamp(m * 1.6) });
    const e = eOut(p(t, 48.8, .5));
    tf($('endT'), { y: (1 - e) * 16, o: e });
  }
}
window.render = tr => renderStory(story(tr));

window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map(i => i.decode().catch(() => {})),
]).then(() => { window.render(0); return true; });

if (location.hash.startsWith('#t=')) window.ready.then(() => window.render(parseFloat(location.hash.slice(3))));
if (location.hash === '#play') window.ready.then(() => { const t0 = performance.now(); const loop = n => { window.render(((n - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
