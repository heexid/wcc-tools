name: CI

# One quick check (~2 min) on every push. It does not block deploys: Vercel builds from GitHub on its own.
# The deeper suites (database tests, Supabase end-to-end) stay in the repo and run locally when needed —
# see app/package.json (db:test, test:parity, test:rls, e2e:supabase).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx next typegen
        env:
          APP_ENV: test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The same build Vercel runs (placeholder keys: the build only checks they are present).
      - run: npm run build
        env:
          APP_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
